[package]
name = "id6-installer"
version = "0.1.0"
description = "Click-to-select installer for NBT Evo ID6 apps"
edition = "2021"

[lib]
name = "id6_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
regex = "1"
if-addrs = "0.13"
tauri-plugin-opener = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
